[project]
name = "parakeet-stt-hello"
version = "0.1.0"
description = "Speech-to-text with NVIDIA Parakeet TDT 0.6B v3: MLX on the GPU, ONNX Runtime on the CPU."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bpython",
    "huggingface-hub>=2.4,<3",
    "mlx-audio>=0.6.5,<0.7",
    "numpy>=2.5,<3",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "onnxruntime>=1.31,<2",
    "sounddevice>=0.5.6,<0.6",
]
